# comfyzone.shop — reverse proxy to the Rails app (Puma) on 127.0.0.1:3000.
# Lives in its own file so it sits beside Maven Heart's site without conflict.
# NOTE: no `default_server` here — Maven Heart's block is the single default
# (nginx_default_server). Install to /etc/nginx/sites-available/comfyzone.shop.conf
# and symlink into sites-enabled. Run `certbot --nginx -d comfyzone.shop
# -d www.comfyzone.shop` afterwards to add the HTTPS block automatically.
#
# CANONICAL HOST: the apex (comfyzone.shop) is canonical; www 301s to it. This
# matters for passkeys/WebAuthn — a credential is bound to the exact origin it
# was created on, so allowing both www and apex to serve the app means a passkey
# made on one origin fails to verify on the other. Keeping a single origin also
# keeps session cookies and SEO clean. APP_ORIGIN (in docker-compose) must equal
# this canonical origin: https://comfyzone.shop.

# WebSocket upgrade mapping for ActionCable (solid_cable) at /cable.
map $http_upgrade $comfyzone_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name comfyzone.shop www.comfyzone.shop;

    # Let's Encrypt HTTP-01 challenge (shared webroot with the other sites).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Up to five product photos in one upload, 8 MB each at most (the browser
    # normally shrinks them first, but must not be relied on).
    client_max_body_size 50m;

    # Send the www host to the apex (preserves path + query). certbot will add
    # the http->https redirect for the apex itself.
    if ($host = www.comfyzone.shop) {
        return 301 https://comfyzone.shop$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (ActionCable) support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $comfyzone_connection_upgrade;
        # Keep idle cable sockets alive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
