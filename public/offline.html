<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#3f1a22">
    <title>No connection | The Comfy Zone</title>
    <!-- Everything is inline: this page is shown when the network is gone,
         so it can't ask for a stylesheet, a font or a script. -->
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f4; color: #2a1f1d;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 1.5rem 0 0.5rem; font-family: Georgia, serif; font-size: 2rem; font-weight: 600; color: #3f1a22; }
      p { margin: 0 0 1rem; line-height: 1.5; color: #5c4f49; }
      button { min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: 0.375rem; background: #3f1a22; color: #faf7f4;
               font: inherit; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="">
      <h1>No connection</h1>
      <p>The app needs the internet to show stock and record sales. Nothing has been lost.</p>
      <p>If you are in the middle of a live, note the claims on paper and add them afterwards with <strong>Add a missed order</strong>.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
