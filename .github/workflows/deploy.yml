# Deploy comfyzone to the production droplet after a push to main, but ONLY
# once the CI workflow (tests, lint, security scans) has passed on it.
#
# How it works (teaching notes):
#   1. GitHub's runner checks out the code (it already has repo access — no
#      GitHub credentials ever need to live on the server).
#   2. The runner rsyncs the working tree to the droplet over SSH.
#   3. The runner SSHes in and rebuilds + restarts the Docker container.
#
# Because the RUNNER pushes to the server, the server never needs to pull from
# GitHub — so the only trust we grant is one SSH key, scoped to one server.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_PRIVATE_KEY  the PRIVATE half of a deploy-only keypair (see deploy/README)
#   SSH_HOST         the droplet IP, e.g. 139.59.172.58
#   SSH_USER         the SSH user, e.g. root
#   DEPLOY_PATH      where comfyzone lives on the server, e.g. /var/www/comfyzone
#
# What is deliberately NOT touched on deploy:
#   - deploy/.env         (server-only secrets: DB password + master key)
#   - /etc/nginx/**       (certbot owns the live TLS + www->apex redirect)
#   - storage/, log/, tmp/ (runtime data stays on the box)

name: Deploy

# `workflow_run` means "start when another workflow finishes". So the order
# is: push to main -> CI runs -> CI finishes -> this workflow starts, and the
# `if:` on the job below lets it continue only when CI was green.
# A failing test now stops the deploy; the site keeps running the last good
# version.
on:
  workflow_run:
    workflows: [ CI ]        # must match the `name:` at the top of ci.yml
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:   # manual deploy from the Actions tab (skips the wait; use with care)

# Never let two deploys run at once; don't cancel one mid-flight either.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Go ahead when started by hand, or when CI passed for a PUSH to main.
    # (CI also runs for pull requests; those must never deploy.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tmp' \
            --exclude 'log' \
            --exclude 'storage' \
            --exclude 'deploy/.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Build, migrate, restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
             cd "${{ secrets.DEPLOY_PATH }}/deploy"
             docker compose build
             docker compose run --rm web ./bin/rails db:prepare
             docker compose up -d
             docker compose ps
             # Every build leaves the previous image behind, untagged. On a
             # shared droplet those add up to a full disk. Remove them.
             docker image prune -f'
